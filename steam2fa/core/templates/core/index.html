<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Steam 2FA — вход</title>
  <style>
    body {
      background: #081925;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: #0f2231;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,.4);
      width: 320px;
      text-align: center;
    }
    h1 { margin-bottom: 25px; }
    input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      outline: none;
      margin-bottom: 10px;
      text-align: center;
    }
    button {
      width: 100%;
      background: #1f5de3;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: #3773fa; }
    .error { color: #ff5a5a; margin-top: 10px; }
  </style>
</head>
<body>
  <form method="post" class="box">
    {% csrf_token %}
    <h1>Steam 2FA</h1>
    <input type="text" name="login" placeholder="Введите логин Steam">
    <button type="submit">Получить код</button>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
  </form>
</body>
</html>
